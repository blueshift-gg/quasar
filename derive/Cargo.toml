[package]
name = "quasar-derive"
description = "Macros for Quasar Solana programs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
syn = { version = "2", features = ["full", "visit"] }
solana-address.workspace = true

[dev-dependencies]
# These workspace-only test dependencies must not form a published dependency cycle.
quasar-lang = { path = "../lang" }
quasar-spl = { path = "../spl" }
trybuild = "1"

[lints]
workspace = true
