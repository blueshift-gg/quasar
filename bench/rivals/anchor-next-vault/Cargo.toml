[package]
name = "anchor-next-vault"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[workspace]

[features]
default = ["no-log-ix-name"]
no-entrypoint = []
cpi = ["no-entrypoint"]
no-idl = []
no-log-ix-name = []
idl-build = []

[dependencies]
# anchor-next at the revision pinned in bench/rivals.sh, which checks it out.
anchor-lang = { path = "../../../target/rivals/src/anchor-next/lang-v2", default-features = false, features = ["alloc"] }
pinocchio = { version = "0.11", default-features = false, features = ["copy"] }
pinocchio-system = "0.6"

[lints.rust.unexpected_cfgs]
level = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
