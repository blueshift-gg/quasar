name: ci
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
    inputs:
      full_check:
        description: Run all gates when invoked by another workflow.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.paths.outputs.code }}
      miri: ${{ steps.paths.outputs.miri }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: paths
        if: ${{ !inputs.full_check && !startsWith(github.ref, 'refs/tags/') }}
        with:
          filters: .github/filters.yml

  miri:
    needs: changes
    if: ${{ inputs.full_check || startsWith(github.ref, 'refs/tags/') || needs.changes.outputs.miri == 'true' }}
    name: Miri (Tree Borrows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned Miri toolchain
        id: miri
        run: echo "toolchain=$(make miri-version)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.miri.outputs.toolchain }}
          components: miri
      - name: Cache Miri dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
          key: ${{ runner.os }}-${{ runner.arch }}-miri-${{ steps.miri.outputs.toolchain }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-miri-${{ steps.miri.outputs.toolchain }}-
      - run: make test-miri test-miri-strict

  check:
    needs: changes
    if: ${{ inputs.full_check || startsWith(github.ref, 'refs/tags/') || needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy, rust-src
      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-
      - name: Cache Solana and SBF toolchains
        uses: actions/cache@v4
        id: solana
        with:
          path: |
            ~/.local/share/solana/
            ~/.cache/solana/
          key: ${{ runner.os }}-${{ runner.arch }}-solana-4.3.2-sbf-1.56
      - name: Install the Solana toolchain
        if: steps.solana.outputs.cache-hit != 'true'
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.3.2/install)"
      # cargo-build-sbf asks GitHub for the latest release unless the requested
      # platform-tools are already installed, and panics if that lookup fails.
      - name: Install SBF platform-tools v1.56
        if: steps.solana.outputs.cache-hit != 'true'
        run: |
          dir="$HOME/.cache/solana/v1.56/platform-tools"
          mkdir -p "$dir"
          curl -sSfL --retry 5 "https://github.com/anza-xyz/platform-tools/releases/download/v1.56/platform-tools-linux-$(uname -m).tar.bz2" \
            | tar -xj -C "$dir"
      - name: Add Solana tools to PATH
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Cache Cargo helper tools
        uses: actions/cache@v4
        id: tools
        with:
          path: |
            ~/.cargo/bin/cargo-expand
            ~/.cargo/bin/cargo-hack
          key: ${{ runner.os }}-${{ runner.arch }}-tools-rust-1.97.1-expand-1.0.121-hack-0.6.45
      - name: Install Kani
        run: cargo install --locked kani-verifier@0.67.0 && cargo kani setup
      - name: Install cargo-expand
        if: steps.tools.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-expand@1.0.121
      - name: Install cargo-hack
        if: steps.tools.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-hack@0.6.45
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - run: make check
      - name: Committed files match what `make check` generates
        run: git diff --exit-code
