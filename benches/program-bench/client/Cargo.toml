# Generated by `quasar idl programs/quasar-bench` (see README). Only the
# dependency block is hand-edited: path dep on quasar-lang and a solana-address
# range compatible with it.
[package]
name = "quasar-bench-client"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
doc = false
test = false
doctest = false

[dependencies]
quasar-lang = { path = "../../../lang" }
wincode = { version = "=0.4.9", features = ["derive"] }
solana-address = { version = "2.5", features = ["curve25519", "wincode"] }
solana-instruction = "3"
