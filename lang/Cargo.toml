[package]
name = "quasar-lang"
description = "Runtime for Quasar Solana programs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# A build to test with, not to deploy: the program makes every check itself,
# leaving none to the calls that make them, and logs which account failed
# which check before it fails. `cargo build-sbf --features quasar-lang/debug`.
debug = []

[dependencies]
quasar-derive.workspace = true
solana-address = { workspace = true, features = ["sha2"] }
solana-program-error.workspace = true
solana-sha256-hasher.workspace = true
zeropod.workspace = true

[target.'cfg(not(target_os = "solana"))'.dependencies]
solana-instruction.workspace = true
solana-sha256-hasher = { workspace = true, features = ["sha2"] }

[target.'cfg(target_os = "solana")'.dependencies]
solana-define-syscall.workspace = true

[dev-dependencies]
proptest.workspace = true
solana-rent.workspace = true
solana-address = { workspace = true, features = ["curve25519"] }

[lints]
workspace = true
